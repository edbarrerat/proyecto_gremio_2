server:
    port: 8081
    
spring:
    datasource:
        url: jdbc:mysql://localhost:3306/db_proyecto_gremio?createDatabaseIfNotExist=true
        username: root
        password:
        driver-class-name: com.mysql.cj.jdbc.Driver
    application:
        name: proyecto_gremio
    jpa:
        hibernate:
            ddl-auto: none
        show-sql: true
                
    flyway:
        enabled: true
        baseline-on-migrate: true

springdoc:
    swagger-ui: 
        path: /doc/swagger-ui/index.html
    api-docs: 
        path: /api-docs