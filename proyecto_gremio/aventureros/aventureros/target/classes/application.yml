spring:
    application:
        name:
            proyecto_gremio

server:
    port:
        8081


spring:
    datasource:
        url:
            jdbc:mysql://localhost:3306/db_proyecto_gremio?createDatabaseIfNotExist=true

        username:
            root
        password:

        driverClassName:
            com.mysql.cj.jdbc.Driver

spring:
    jpa:
        hibernate:
            ddl-auto:
                none
            show-sql:
                true

spring:
    flyway:
        enabled:
            true
        baseline-on-migrate:
            true