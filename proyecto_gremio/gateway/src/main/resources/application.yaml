server:
  port: 8081

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: aventureros-service
              uri: http://127.0.0.1:8082
              predicates:
                - Path=/api/v1/**

            - id: party-service
              uri: http://127.0.0.1:8083
              predicates:
                - Path=/api/v1/**
            
            - id: gremio-service
              uri: http://127.0.0.1:8084
              predicates:
                - Path=/api/v1/**